<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCatalogue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- entête -->
<header>
    <h1>🎌 AnimeCatalogue</h1>
    <p>Ta collection d'animés personnelle</p>
</header>

<main>

    <div class="toolbar">
        <label for="search" class="sr-only">Rechercher un animé</label>
        <input type="text" id="search" placeholder="Rechercher un animé...">
        <button id="btn-sort" class="btn btn-primary">Trier par note ↓</button>

        <!-- menu déroulant pour filtrer par catégorie -->
        <label for="filter-theme" class="sr-only">Filtrer par thème</label>
        <select id="filter-theme">
            <option value="">Tous les thèmes</option>
            <option value="Action">Action</option>
            <option value="Aventure">Aventure</option>
            <option value="Comédie">Comédie</option>
            <option value="Drame">Drame</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Romance">Romance</option>
            <option value="Science-Fiction">Science-Fiction</option>
            <option value="Shonen">Shonen</option>
        </select>

    </div>

    <div id="list"></div>

    <form id="form-add" novalidate>
        <h2>Ajouter un animé</h2>

        <div class="form-group">
            <label for="input-name">Nom</label>
            <input type="text" id="input-name" placeholder="Ex : Demon Slayer" required>
        </div>

        <!-- menu déroulant pour filtrer par catégorie (à l'ajout) -->
        <div class="form-group">
            <label for="input-theme">Thème</label>
            <select id="input-theme">
                <option value="Action">Action</option>
                <option value="Aventure">Aventure</option>
                <option value="Comédie">Comédie</option>
                <option value="Drame">Drame</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Romance">Romance</option>
                <option value="Science-Fiction">Science-Fiction</option>
                <option value="Shonen">Shonen</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-rating">Note (1–10)</label>
            <input type="number" id="input-rating" min="1" max="10" step="0.1" placeholder="8.5">
        </div>

        <div class="form-group">
            <label for="input-year">Année</label>
            <input type="number" id="input-year" min="1960" max="2026" placeholder="2024">
        </div>

        <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
</main>

<!-- pied de page -->
<footer>
    <p>AnimeCatalogue — 122-projet-perso-Joshua-Frein</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
